# 活动列表：按时间倒序排列（最新的放最上面）
#
# 每项字段：
#   title     活动标题（中文页显示）
#   title_en  活动标题（英文页显示；不填则英文页也用 title）
#   date      日期，必须写完整的 YYYY-MM-DD（显示时只取到「年月」，
#             日不确定就随便填个 01，页面上不会显示出来）
#   photos    照片列表，每张：
#     img         图片路径（放在 assets/img/activities/<活动名>/ 下）
#     caption     图片说明（中文页显示，可选）
#     caption_en  图片说明（英文页显示，可选；不填则英文页不显示说明）
#
# 加新活动：把照片放进 assets/img/activities/<活动名>/，照着下面复制一段改就行。

