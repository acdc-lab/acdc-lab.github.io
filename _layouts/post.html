---
layout: default
---

<article class="post-content">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date">📅 {{ page.date | date: "{% if page.lang == 'en' %}%b %-d, %Y{% else %}%-m月 %-d, %Y{% endif %}" }}</time>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
