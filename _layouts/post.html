---
layout: default
---

<article class="post-content">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.lang == 'en' %}
      {% assign post_date_fmt = "%b %-d, %Y" %}
    {% else %}
      {% assign post_date_fmt = "%-m月 %-d, %Y" %}
    {% endif %}
    <time class="post-date">📅 {{ page.date | date: post_date_fmt }}</time>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
