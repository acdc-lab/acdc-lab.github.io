<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- 站点主样式 -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/homepage-scheme-a-original-text.css' | relative_url }}">
</head>

<body>
  <!-- 顶部导航栏 -->
  {% include header.html %}

  <!-- 主体内容容器 -->
  <main class="page-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- 防爬虫：邮箱地址 base64 编码，页面加载后由 JS 解码还原 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('a[data-mail]').forEach(function (a) {
        var email = '';
        try { email = atob(a.getAttribute('data-mail')); } catch (e) { return; }
        a.href = 'mailto:' + email;
        if (a.hasAttribute('data-mail-show')) a.textContent = email;
      });
    });
  </script>
</body>
</html>
