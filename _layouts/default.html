<!DOCTYPE html>
<html lang="{% if page.lang == 'en' %}en{% else %}zh-CN{% endif %}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Site styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/homepage-scheme-a-original-text.css' | relative_url }}">
</head>

<body>
  <!-- Top navigation -->
  {% include header.html %}

  <!-- Main content container -->
  <main class="page-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Anti-scraping: email is base64-encoded, decoded by JS on load -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('a[data-mail]').forEach(function (a) {
        var email = '';
        try { email = atob(a.getAttribute('data-mail')); } catch (e) { return; }
        a.href = 'mailto:' + email;
        if (a.hasAttribute('data-mail-show')) a.textContent = email;
      });
    });
  </script>
</body>
</html>
