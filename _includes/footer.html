<footer class="site-footer">
  <div class="footer-inner">
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    <p>Designed by Zhenye Yang & Jun Ma</p>
  </div>

  {% if site.flagcounter_src and site.flagcounter_src != "" %}
  <div class="visitor-map">
    <div class="visitor-map-label">Visitor Map</div>
    {% if site.flagcounter_link and site.flagcounter_link != "" %}
    <a href="{{ site.flagcounter_link }}" target="_blank" rel="noopener">
      <img src="{{ site.flagcounter_src }}" alt="Visitor map" loading="lazy" border="0">
    </a>
    {% else %}
    <img src="{{ site.flagcounter_src }}" alt="Visitor map" loading="lazy" border="0">
    {% endif %}
  </div>
  {% endif %}
</footer>
