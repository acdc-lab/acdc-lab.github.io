<canvas class="acdc-hero-particles" aria-hidden="true"></canvas>
<button class="acdc-motion-toggle" type="button" hidden
        data-pause="{% if page.lang == 'en' %}Pause animation{% else %}暂停动画{% endif %}"
        data-resume="{% if page.lang == 'en' %}Resume animation{% else %}播放动画{% endif %}">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <g class="acdc-pause-icon"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></g>
    <path class="acdc-play-icon" d="M6 4l14 8-14 8z"/>
  </svg>
</button>
<script type="module" src="{{ '/assets/js/hero-particles.js' | relative_url }}"></script>
